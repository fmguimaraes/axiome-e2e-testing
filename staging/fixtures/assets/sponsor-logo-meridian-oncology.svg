  logo. "Meridian Oncology" is an INVENTED, plainly fictional sponsor name —
  it names no real company, product, or organization, living or historical.
  The mark itself is a plain geometric monogram (three concentric arcs
  suggesting an orbit/meridian line, no pictograms, no color palette or
  wordmark style borrowed from any real pharmaceutical or biotech brand) so
  it reads as an illustrative placeholder, not a reference-customer claim.
  See the AXI-1379 design note (Jira) and `sponsorExportStaging.ts`'s module
  doc for the full EC11 rationale.
-->
